name: Build custom image artifact (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. mno-20260927)"
        required: true
        type: string
      version:
        description: "VERSION file content"
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Write VERSION
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${{ inputs.tag }}-$(git rev-parse --short HEAD)"; fi
          echo "$V" > VERSION
          cat VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (amd64, load)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: new-api-custom:${{ inputs.tag }}
          cache-from: type=gha
          outputs: type=docker,dest=/tmp/new-api-custom.tar

      - name: Compress
        run: gzip -1 /tmp/new-api-custom.tar

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: new-api-custom-${{ inputs.tag }}
          path: /tmp/new-api-custom.tar.gz
          retention-days: 3
