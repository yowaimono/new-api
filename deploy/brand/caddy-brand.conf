# 品牌图片静态路由
#
# 追加到 ai.kyeai.xyz 的站点块内，且必须放在兜底的 `handle { }` 之前。
# 加完执行: docker exec caddy caddy validate --config /etc/caddy/Caddyfile
#           docker exec caddy caddy reload   --config /etc/caddy/Caddyfile
#
# 文件位置:
#   宿主机 /opt/new-api-custom/caddy/www/brand/logo-1x1.png
#   容器内 /etc/caddy/www/brand/logo-1x1.png
#
# 对外地址: https://ai.kyeai.xyz/brand/logo-1x1.png

handle /brand/* {
    root * /etc/caddy/www
    file_server
}
